name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify Airbnb Workbench]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@fab15f511967b52f886285322a82547db1df881a
    with:
      controller_ref: fab15f511967b52f886285322a82547db1df881a
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}