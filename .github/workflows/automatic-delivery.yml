name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify Airbnb Workbench]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@321a857ef17570906f01bf61164d0b8e59147ecc
    with:
      controller_ref: 321a857ef17570906f01bf61164d0b8e59147ecc
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}