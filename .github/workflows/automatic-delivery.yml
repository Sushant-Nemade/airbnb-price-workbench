name: Automatic Maintenance Delivery
on:
  workflow_run:
    workflows: [Verify Airbnb Workbench]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-delivery.yml@e205849fa00bfcafb83b1bc645ae26e9ca378b47
    with:
      controller_ref: e205849fa00bfcafb83b1bc645ae26e9ca378b47
      completed_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}