name: Daily Reviewed Maintenance
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      pilot:
        description: Explicit manual pilot outside the shared daily selection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/portfolio-maintenance.yml@e205849fa00bfcafb83b1bc645ae26e9ca378b47
    with:
      controller_ref: e205849fa00bfcafb83b1bc645ae26e9ca378b47
      pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}