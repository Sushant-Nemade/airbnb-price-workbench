name: Daily Reviewed Maintenance
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      pilot:
        description: Explicit manual pilot outside the shared daily selection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/portfolio-maintenance.yml@321a857ef17570906f01bf61164d0b8e59147ecc
    with:
      controller_ref: 321a857ef17570906f01bf61164d0b8e59147ecc
      pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}