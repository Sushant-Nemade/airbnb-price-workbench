name: Verify Airbnb Workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run build
      - run: node frontend/node_modules/@playwright/test/cli.js install chromium --with-deps
      - run: node frontend/node_modules/@playwright/test/cli.js test --config frontend/playwright.config.ts
      - run: npm --prefix frontend audit
      - run: uv run --frozen pip-audit
      - run: uv run --frozen python scripts/package_site.py
      - run: uv run --frozen python -m build
      - run: uv run --frozen twine check dist/*
      - run: uv run --frozen python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: airbnb-price-workbench-reference
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.python }}
          path: frontend/test-results
  reproduce:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen
      - run: uv run --frozen airbnb-prices fetch-data
      - run: uv run --frozen airbnb-prices train --output build/reproduced
      - run: |
          uv run --frozen python -c "import json; from pathlib import Path; expected=json.loads(Path('src/airbnb_price/artifacts/report.json').read_text()); actual=json.loads(Path('build/reproduced/report.json').read_text()); assert expected['splits']==actual['splits']; assert abs(actual['evaluation']['test']['mae_usd']-expected['evaluation']['test']['mae_usd']) < 0.5; print('Actual dataset/training reproduced with fixed host splits and evaluation tolerance')"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t airbnb-workbench .
      - run: docker run --rm airbnb-workbench python -c "import os; assert os.getuid()!=0; from airbnb_price.runtime import get_model; from airbnb_price.contracts import Listing; print(get_model().predict(Listing()))"
      - run: |
          docker run -d --name airbnb-workbench -p 127.0.0.1:8896:8000 airbnb-workbench
          curl --fail --retry 8 --retry-all-errors --connect-timeout 3 --max-time 5 --retry-max-time 60 --retry-delay 1 http://127.0.0.1:8896/health
          curl --fail http://127.0.0.1:8896/
      - if: always()
        run: |
          docker logs airbnb-workbench || true
          docker rm -f airbnb-workbench || true